<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roshan Academy | Pro Quiz & Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="Faviocn.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        background-image: url('Quiz Background.jpg');
        background-size: cover; background-position: center; background-attachment: fixed;
      }
      .hidden { display: none !important; }
      .glass-bg { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      .slide-in { animation: slideUp 0.4s ease-out forwards; }
      @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
      .option-btn { transition: all 0.2s ease; border: 2px solid rgba(0,0,0,0.05); }
      .option-btn:hover { border-color: #3b82f6; background-color: white; transform: translateY(-2px); }
      .progress-bar { transition: width 0.4s ease-in-out; }
      .timer-bar { transition: width 1s linear; }
    </style>
  </head>
  <body class="antialiased text-slate-900 min-h-screen flex flex-col items-center justify-center">

    <div class="fixed top-0 left-0 w-full h-1.5 bg-white/30 z-50">
      <div id="progress-bar" class="progress-bar h-full bg-blue-600 shadow-[0_0_10px_#3b82f6]" style="width: 0%"></div>
    </div>
    
    <div class="fixed top-1.5 left-0 w-full h-1 bg-slate-100 z-50">
      <div id="timer-bar" class="timer-bar h-full bg-emerald-500" style="width: 100%"></div>
    </div>

    <div class="w-full max-w-5xl px-6 py-8 glass-bg min-h-[85vh] md:rounded-[40px] shadow-2xl flex flex-col relative overflow-hidden my-4">
      
      <div id="auth-screen" class="w-full max-w-md mx-auto space-y-8 slide-in text-center my-auto">
        <h1 class="text-4xl font-extrabold tracking-tight italic text-blue-600">Roshan Academy</h1>
        <div class="space-y-4">
            <input type="email" id="auth-email" placeholder="Email" class="w-full p-4 rounded-2xl bg-white shadow-sm outline-none focus:ring-2 focus:ring-blue-500" />
            <input type="password" id="auth-password" placeholder="Password" class="w-full p-4 rounded-2xl bg-white shadow-sm outline-none focus:ring-2 focus:ring-blue-500" />
            
            <button id="login-btn" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold text-lg hover:bg-blue-700 shadow-lg transition-all">Sign In</button>
            
            <p class="text-sm text-slate-500 pt-2">
              <span id="auth-toggle-text">Don't have an account?</span> 
              <a id="auth-toggle-link" href="#" class="text-blue-600 font-bold hover:underline">Create one</a>
            </p>
        </div>
      </div>

      <div id="selection-screen" class="hidden w-full space-y-6 slide-in">
        <header class="flex justify-between items-center mb-4 border-b pb-4">
            <h2 class="text-2xl font-extrabold">Welcome, <span id="welcome-user" class="text-blue-600">Learner</span></h2>
            <button id="logout-btn" class="text-red-500 font-bold text-xs uppercase tracking-widest hover:underline">Logout</button>
        </header>

        <div class="flex gap-4 mb-6">
            <button id="tab-quiz" class="pb-2 px-6 font-bold border-b-4 border-blue-600 text-blue-600 transition-all">Quiz</button>
            <button id="tab-leaderboard" class="pb-2 px-6 font-bold text-slate-400 hover:text-slate-600 transition-all">Leaderboard</button>
        </div>

        <div id="quiz-tab-content" class="space-y-6 max-w-2xl mx-auto">
            <div class="grid md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase text-slate-400 ml-2">Class</label>
                    <select id="standard" class="w-full p-4 rounded-2xl bg-white shadow-sm outline-none border border-slate-100">
                        <script>for(let i=1; i<=12; i++) document.write(`<option value="${i}">Grade ${i}</option>`);</script>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase text-slate-400 ml-2">Subject</label>
                    <select id="subject-select" class="w-full p-4 rounded-2xl bg-white shadow-sm outline-none border border-slate-100">
                        <option value="">Select Subject</option>
                    </select>
                </div>
            </div>
            
            <div id="chapter-container" class="space-y-2 hidden slide-in">
                <label class="text-xs font-bold uppercase text-slate-400 ml-2">Chapter (Focus)</label>
                <select id="chapter-select" class="w-full p-4 rounded-2xl bg-white shadow-sm outline-none border border-slate-100">
                    <option value="">Full Subject Test</option>
                </select>
            </div>

            <button id="start-quiz" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold text-xl hover:scale-[1.02] active:scale-95 transition-all shadow-xl">Launch Quiz</button>
        </div>

        <div id="leaderboard-tab-content" class="hidden max-w-2xl mx-auto space-y-4">
            <div id="leaderboard-list" class="space-y-2"></div>
        </div>

        <div id="admin-link-container" class="hidden pt-6 border-t border-slate-200 text-center mt-auto">
            <button id="go-to-admin" class="text-slate-400 text-xs font-bold hover:text-blue-600 tracking-widest uppercase"><i class="fas fa-lock"></i> Admin Panel</button>
        </div>
      </div>

      <div id="admin-screen" class="hidden w-full space-y-6 slide-in overflow-y-auto">
        <div class="flex justify-between items-center border-b pb-4">
            <h2 class="text-2xl font-extrabold text-slate-800">Admin Console</h2>
            <button id="admin-back" class="bg-blue-100 text-blue-700 px-6 py-2 rounded-xl font-bold text-sm hover:bg-blue-200 transition">Back</button>
        </div>
        
        <div class="grid lg:grid-cols-2 gap-8 px-2">
            <div class="space-y-4 bg-slate-50 p-6 rounded-[30px] relative">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-500 uppercase text-xs">Create Content</h3>
                    <span id="q-number-badge" class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question #1</span>
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <select id="q-std" class="p-3 bg-white rounded-xl shadow-sm outline-none text-sm border-none"><script>for(let i=1; i<=12; i++) document.write(`<option value="${i}">Grade ${i}</option>`);</script></select>
                    <select id="q-type" class="p-3 bg-white rounded-xl shadow-sm outline-none text-sm border-none"><option value="mcq">MCQ</option><option value="short">Short</option></select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="q-sub-select" class="p-3 bg-white rounded-xl shadow-sm text-sm border-none"><option value="">Existing Sub</option></select>
                    <input type="text" id="q-sub-new" placeholder="New Subject" class="p-3 bg-white rounded-xl shadow-sm outline-none text-sm border-none" />
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="q-chap-select" class="p-3 bg-white rounded-xl shadow-sm text-sm border-none"><option value="">Existing Chap</option></select>
                    <input type="text" id="q-chap-new" placeholder="New Chapter" class="p-3 bg-white rounded-xl shadow-sm outline-none text-sm border-none" />
                </div>
                
                <textarea id="q-text" placeholder="Question Text" class="w-full p-4 bg-white rounded-xl shadow-sm outline-none text-sm h-24 border-none"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="q-o1" placeholder="Opt 1" class="p-3 bg-white rounded-xl text-xs border-none" /><input type="text" id="q-o2" placeholder="Opt 2" class="p-3 bg-white rounded-xl text-xs border-none" />
                    <input type="text" id="q-o3" placeholder="Opt 3" class="p-3 bg-white rounded-xl text-xs border-none" /><input type="text" id="q-o4" placeholder="Opt 4" class="p-3 bg-white rounded-xl text-xs border-none" />
                </div>
                <input type="text" id="q-ans" placeholder="Answer Key" class="w-full p-4 bg-blue-600 text-white rounded-2xl font-bold text-sm shadow-lg border-none" />
                
                <button id="add-q-btn" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold hover:bg-black transition-all">Add Question</button>
            </div>

            <div class="space-y-4">
                <h3 class="font-bold text-slate-500 uppercase text-xs">Control Center</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button id="export-btn" class="bg-green-600 text-white p-4 rounded-2xl font-bold text-xs shadow-lg shadow-green-100 uppercase">Export XLSX</button>
                    <button id="clear-results-btn" class="bg-red-600 text-white p-4 rounded-2xl font-bold text-xs shadow-lg shadow-red-100 uppercase">Reset Leaderboard</button>
                </div>
                <div id="admin-q-list" class="space-y-2 max-h-96 overflow-y-auto text-xs border-t pt-4"></div>
            </div>
        </div>
      </div>

      <div id="quiz-screen" class="hidden w-full my-auto space-y-10 slide-in">
        <div id="quiz-active-container" class="space-y-10">
          <div class="text-center space-y-4">
              <span id="q-category" class="inline-block px-4 py-1 bg-blue-100 text-blue-700 rounded-full font-bold text-xs uppercase tracking-widest italic">Quiz</span>
              <h2 id="question-text" class="text-3xl md:text-5xl font-extrabold leading-tight text-slate-900 px-4"></h2>
          </div>
          <div id="options-grid" class="grid md:grid-cols-2 gap-4 w-full max-w-3xl mx-auto"></div>
          <div class="flex justify-between items-center max-w-3xl mx-auto pt-10 border-t border-slate-200/50">
              <div class="flex items-center gap-3 font-bold">
                <span id="live-medal-display" class="text-2xl bg-white shadow-sm px-4 py-2 rounded-2xl border border-slate-100">🏆</span>
                <span id="timer-display" class="text-xl bg-amber-100 text-amber-700 px-6 py-2 rounded-2xl flex items-center gap-2">
                  <i class="fas fa-clock animate-pulse"></i> 30s
                </span>
              </div>
              <span id="q-count" class="text-slate-400 font-bold uppercase text-sm">Question 1/10</span>
          </div>
        </div>

        <div id="quiz-results-container" class="hidden max-w-md mx-auto text-center space-y-6 bg-white p-8 rounded-[32px] shadow-xl border border-slate-50 slide-in">
            <div id="results-medal-icon" class="text-7xl animate-bounce">🏆</div>
            <div class="space-y-1">
                <h3 class="text-xs uppercase font-extrabold tracking-widest text-slate-400">Quiz Complete!</h3>
                <h2 id="results-user-name" class="text-2xl font-black text-slate-800">Student Name</h2>
            </div>
            
            <div class="bg-slate-50 p-6 rounded-2xl grid grid-cols-2 gap-4">
                <div class="text-left space-y-0.5">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Total Score</span>
                    <div id="results-score-text" class="text-xl font-extrabold text-blue-600">0 / 0</div>
                </div>
                <div class="text-right space-y-0.5">
                    <span class="text-[10px] uppercase font-bold text-slate-400">Percentage</span>
                    <div id="results-percent-text" class="text-xl font-extrabold text-emerald-600">0%</div>
                </div>
            </div>

            <button onclick="location.reload()" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold text-md hover:bg-black transition-all shadow-lg">Return to Menu</button>
        </div>

      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, collection, addDoc, getDocs, getDoc, deleteDoc, doc, updateDoc, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCnY-wJzabkuvFD5v1eUpZyY_Gx0FPv4zI",
        authDomain: "roshan-academy.firebaseapp.com",
        projectId: "roshan-academy",
        storageBucket: "roshan-academy.firebasestorage.app",
        messagingSenderId: "644092003401",
        appId: "1:644092003401:web:f195aab704a3280ecb6b98",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const ADMIN_EMAILS = ["rkjha7281@gmail.com", "rkjha.roshan9@gmail.com"];

      let quiz = { data: [], current: 0, score: 0, timer: null };
      let isSignInMode = true; 
      
      let currentEditingDocId = null;
      let editModeActive = false;

      const navigate = (id) => ['auth-screen', 'selection-screen', 'admin-screen', 'quiz-screen'].forEach(s => document.getElementById(s).classList.toggle("hidden", s !== id));

      onAuthStateChanged(auth, (user) => {
        if (user) {
          navigate('selection-screen');
          document.getElementById("welcome-user").innerText = user.displayName || user.email.split('@')[0];
          document.getElementById("admin-link-container").classList.toggle("hidden", !ADMIN_EMAILS.includes(user.email.toLowerCase().trim()));
          refreshGlobalLists();
          loadLeaderboard();
        } else navigate('auth-screen');
      });

      async function refreshGlobalLists() {
        const snap = await getDocs(collection(db, "questions"));
        const subs = new Set(), chaps = new Set();
        snap.forEach(d => {
            const data = d.data();
            if(data.sub) subs.add(data.sub.toUpperCase());
            if(data.chapter) chaps.add(data.chapter.toUpperCase());
        });
        const subOpts = '<option value="">Select Subject</option>' + Array.from(subs).sort().map(s => `<option value="${s}">${s}</option>`).join('');
        document.getElementById("subject-select").innerHTML = subOpts;
        document.getElementById("q-sub-select").innerHTML = subOpts;
        document.getElementById("q-chap-select").innerHTML = '<option value="">Existing Chapter</option>' + Array.from(chaps).sort().map(c => `<option value="${c}">${c}</option>`).join('');
        updateQuestionCountBadge();
      }

      async function updateQuestionCountBadge() {
        const std = document.getElementById("q-std").value;
        const sub = document.getElementById("q-sub-new").value.trim().toUpperCase() || document.getElementById("q-sub-select").value;
        const chap = document.getElementById("q-chap-new").value.trim().toUpperCase() || document.getElementById("q-chap-select").value;
        const badge = document.getElementById("q-number-badge");

        if (!sub || !chap) {
            badge.innerText = "Question #1";
            return;
        }

        const qry = query(collection(db, "questions"), where("std", "==", std), where("sub", "==", sub), where("chapter", "==", chap));
        const snap = await getDocs(qry);
        badge.innerText = `Question #${snap.size + 1}`;
      }

      document.getElementById("q-std").onchange = updateQuestionCountBadge;
      document.getElementById("q-sub-select").onchange = updateQuestionCountBadge;
      document.getElementById("q-sub-new").oninput = updateQuestionCountBadge;
      document.getElementById("q-chap-select").onchange = updateQuestionCountBadge;
      document.getElementById("q-chap-new").oninput = updateQuestionCountBadge;

      const updateChapters = async () => {
        const sub = document.getElementById("subject-select").value;
        const std = document.getElementById("standard").value;
        if(!sub || !std) return;
        const qry = query(collection(db, "questions"), where("sub", "==", sub), where("std", "==", std));
        const snap = await getDocs(qry);
        const chaps = new Set();
        snap.forEach(d => { if(d.data().chapter) chaps.add(d.data().chapter); });
        const container = document.getElementById("chapter-container");
        if(chaps.size > 0) {
            container.classList.remove("hidden");
            document.getElementById("chapter-select").innerHTML = '<option value="">Full Subject Test</option>' + 
                Array.from(chaps).sort().map(c => `<option value="${c}">${c}</option>`).join('');
        } else container.classList.add("hidden");
      };

      document.getElementById("subject-select").onchange = updateChapters;
      document.getElementById("standard").onchange = updateChapters;

      document.getElementById("start-quiz").onclick = async () => {
        const sub = document.getElementById("subject-select").value, chap = document.getElementById("chapter-select").value, std = document.getElementById("standard").value;
        if(!sub || !std) return alert("Select Grade and Subject!");
        let qry = query(collection(db, "questions"), where("sub", "==", sub), where("std", "==", std));
        if(chap && !document.getElementById("chapter-container").classList.contains("hidden")) {
            qry = query(collection(db, "questions"), where("sub", "==", sub), where("std", "==", std), where("chapter", "==", chap));
        }
        const snap = await getDocs(qry);
        quiz.data = snap.docs.map(d => d.data()).sort(() => Math.random() - 0.5);
        if(quiz.data.length === 0) return alert("No questions found.");
        
        // Ensure standard question presentation area is visible upon initialize
        document.getElementById("quiz-active-container").classList.remove("hidden");
        document.getElementById("quiz-results-container").classList.add("hidden");

        quiz.current = 0; quiz.score = 0;
        navigate('quiz-screen'); renderStep();
      };

      function renderStep() {
        const q = quiz.data[quiz.current];
        document.getElementById("progress-bar").style.width = `${((quiz.current + 1) / quiz.data.length) * 100}%`;
        document.getElementById("q-count").innerText = `Question ${quiz.current + 1}/${quiz.data.length}`;
        document.getElementById("question-text").innerText = q.question;
        document.getElementById("q-category").innerText = `${q.sub} | ${q.chapter || 'Lesson'}`;
        
        updateLiveMedalIndicator();

        const grid = document.getElementById("options-grid"); grid.innerHTML = "";
        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn w-full p-6 text-left rounded-[24px] bg-white text-lg font-semibold shadow-sm flex items-center gap-4";
            btn.innerHTML = `<span class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-[10px] text-blue-600 font-black">●</span> <span>${opt}</span>`;
            btn.onclick = () => {
                clearInterval(quiz.timer);
                const isCorrect = opt.trim().toLowerCase() === q.answer.trim().toLowerCase();
                if(isCorrect) { quiz.score++; btn.classList.add("bg-green-50", "border-green-500"); }
                else btn.classList.add("bg-red-50", "border-red-500");
                setTimeout(async () => {
                    quiz.current++;
                    if(quiz.current < quiz.data.length) renderStep();
                    else finishQuizGracefully(); // Render visual scoreboard on complete
                }, 800);
            };
            grid.appendChild(btn);
        });
        startTimer();
      }

      function updateLiveMedalIndicator() {
        const medalEl = document.getElementById("live-medal-display");
        if (quiz.current === 0) {
            medalEl.innerText = "🏆"; 
            return;
        }
        const runningAccuracy = (quiz.score / quiz.current) * 100;
        if (runningAccuracy === 100) medalEl.innerText = "🏆";
        else if (runningAccuracy >= 90) medalEl.innerText = "🥇";
        else if (runningAccuracy >= 75) medalEl.innerText = "🥈";
        else if (runningAccuracy >= 60) medalEl.innerText = "🥉";
        else medalEl.innerText = "⭐";
      }

      function startTimer() {
        let maxTime = 30; let t = maxTime;
        const timerText = document.getElementById("timer-display");
        const timerBar = document.getElementById("timer-bar");

        timerText.innerText = `${t}s`;
        timerText.className = "text-xl bg-amber-100 text-amber-700 px-6 py-2 rounded-2xl flex items-center gap-2";
        timerBar.style.width = "100%";
        timerBar.className = "timer-bar h-full bg-emerald-500";

        clearInterval(quiz.timer);
        
        quiz.timer = setInterval(() => { 
            t--; 
            timerText.innerText = `${t}s`; 
            const pctRemaining = (t / maxTime) * 100;
            timerBar.style.width = `${pctRemaining}%`;

            if (t <= 15 && t > 5) {
                timerText.className = "text-xl bg-orange-100 text-orange-700 px-6 py-2 rounded-2xl flex items-center gap-2 animate-pulse";
                timerBar.className = "timer-bar h-full bg-orange-500";
            } else if (t <= 5) {
                timerText.className = "text-xl bg-red-100 text-red-700 px-6 py-2 rounded-2xl flex items-center gap-2 animate-bounce";
                timerBar.className = "timer-bar h-full bg-red-600 shadow-[0_0_8px_#dc2626]";
            }

            if(t <= 0) { 
                clearInterval(quiz.timer); 
                quiz.current++; 
                if(quiz.current < quiz.data.length) {
                    alert("Time's Up! Moving to next question.");
                    renderStep(); 
                } else finishQuizGracefully();
            }
        }, 1000);
      }

      // --- NEW UPGRADED SYSTEM METHOD: Render interactive results sheet dashboard display layout directly ---
      async function finishQuizGracefully() {
        clearInterval(quiz.timer);
        
        // Hide running countdown timelines top tracking components completely
        document.getElementById("timer-bar").style.width = "0%";
        document.getElementById("progress-bar").style.width = "100%";
        
        // Save score profiles async directly into backend data arrays first
        const studentName = auth.currentUser.displayName || auth.currentUser.email.split('@')[0];
        await addDoc(collection(db, "quiz_results"), { name: studentName, score: quiz.score, total: quiz.data.length, at: serverTimestamp() });

        // Retract running questions panel layout frames completely from view container
        document.getElementById("quiz-active-container").classList.add("hidden");
        
        // Parse final score properties to determine custom award tier allocation profiles
        const scorePercent = quiz.data.length > 0 ? (quiz.score / quiz.data.length) * 100 : 0;
        let finalMedal = "⭐";
        if (scorePercent === 100) finalMedal = "🏆";
        else if (scorePercent >= 90) finalMedal = "🥇";
        else if (scorePercent >= 75) finalMedal = "🥈";
        else if (scorePercent >= 60) finalMedal = "🥉";

        // Inject dynamic values directly into HTML Scorecard component selectors
        document.getElementById("results-medal-icon").innerText = finalMedal;
        document.getElementById("results-user-name").innerText = studentName;
        document.getElementById("results-score-text").innerText = `${quiz.score} / ${quiz.data.length}`;
        document.getElementById("results-percent-text").innerText = `${Math.round(scorePercent)}%`;

        // Surface full scorecard container block smoothly
        document.getElementById("quiz-results-container").classList.remove("hidden");
      }

      // --- ADD & UPDATE UNIFIED TRANSACTION HANDLER ---
      document.getElementById("add-q-btn").onclick = async () => {
        const subNewEl = document.getElementById("q-sub-new");
        const subSelectEl = document.getElementById("q-sub-select");
        const chapNewEl = document.getElementById("q-chap-new");
        const chapSelectEl = document.getElementById("q-chap-select");
        const qTextEl = document.getElementById("q-text");
        const ansEl = document.getElementById("q-ans");
        const saveBtn = document.getElementById("add-q-btn");

        const sub = subNewEl.value.trim().toUpperCase() || subSelectEl.value;
        const chap = chapNewEl.value.trim().toUpperCase() || chapSelectEl.value;
        
        if(!sub || !chap || !qTextEl.value) return alert("Fill all fields!");

        const questionPayload = {
            std: document.getElementById("q-std").value, 
            sub, 
            chapter: chap, 
            type: document.getElementById("q-type").value,
            question: qTextEl.value, 
            options: [
                document.getElementById("q-o1").value, 
                document.getElementById("q-o2").value, 
                document.getElementById("q-o3").value, 
                document.getElementById("q-o4").value
            ],
            answer: ansEl.value.trim(), 
            createdAt: serverTimestamp()
        };
        
        try {
            if (editModeActive && currentEditingDocId) {
                await updateDoc(doc(db, "questions", currentEditingDocId), questionPayload);
                alert("Question updated successfully! ✅");
                editModeActive = false;
                currentEditingDocId = null;
                saveBtn.innerText = "Add Question";
                saveBtn.className = "w-full bg-slate-900 text-white p-4 rounded-2xl font-bold hover:bg-black transition-all";
            } else {
                await addDoc(collection(db, "questions"), questionPayload);
                alert("Question saved successfully! 🚀");
            }

            if (subNewEl.value.trim()) {
                subSelectEl.value = sub;
                subNewEl.value = "";
            }
            if (chapNewEl.value.trim()) {
                chapSelectEl.value = chap;
                chapNewEl.value = "";
            }

            qTextEl.value = "";
            document.getElementById("q-o1").value = "";
            document.getElementById("q-o2").value = "";
            document.getElementById("q-o3").value = "";
            document.getElementById("q-o4").value = "";
            ansEl.value = "";

            refreshGlobalLists(); 
            loadAdminQuestions();
            qTextEl.focus();
        } catch (err) {
            console.error(err);
        }
      };

      window.editQ = async (id) => {
        const qTextEl = document.getElementById("q-text");
        const saveBtn = document.getElementById("add-q-btn");

        try {
            const docSnap = await getDoc(doc(db, "questions", id));
            if (!docSnap.exists()) return alert("Question profile file not found.");
            
            const data = docSnap.data();
            currentEditingDocId = id; 
            editModeActive = true;

            document.getElementById("q-std").value = data.std;
            document.getElementById("q-type").value = data.type;
            document.getElementById("q-sub-select").value = data.sub;
            document.getElementById("q-chap-select").value = data.chapter;
            qTextEl.value = data.question;
            document.getElementById("q-o1").value = data.options[0] || "";
            document.getElementById("q-o2").value = data.options[1] || "";
            document.getElementById("q-o3").value = data.options[2] || "";
            document.getElementById("q-o4").value = data.options[3] || "";
            document.getElementById("q-ans").value = data.answer;

            saveBtn.innerText = "Update Question Changes";
            saveBtn.className = "w-full bg-amber-600 text-white p-4 rounded-2xl font-bold hover:bg-amber-700 transition-all shadow-lg";
            
            qTextEl.focus();
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        } catch (err) {
            console.error(err);
        }
      };

      // BULLETPROOF LEADERBOARD RESET
      document.getElementById("clear-results-btn").onclick = async () => {
        if (confirm("DANGER: This will permanently delete ALL student scores. Proceed?")) {
            try {
                const snap = await getDocs(collection(db, "quiz_results"));
                if (snap.empty) return alert("Leaderboard is already empty.");

                const btn = document.getElementById("clear-results-btn");
                btn.innerText = "CLEARING...";
                btn.disabled = true;

                const promises = snap.docs.map(d => deleteDoc(doc(db, "quiz_results", d.id)));
                await Promise.all(promises);

                alert("Leaderboard cleared!");
                location.reload();
            } catch (error) {
                console.error(error);
            } finally {
                document.getElementById("clear-results-btn").innerText = "RESET LEADERBOARD";
                document.getElementById("clear-results-btn").disabled = false;
            }
        }
      };

      // REGISTRATION CAPTURES BLOCK
      const loginBtn = document.getElementById("login-btn");
      const authToggleLink = document.getElementById("auth-toggle-link");
      const authToggleText = document.getElementById("auth-toggle-text");

      if (authToggleLink && loginBtn) {
        authToggleLink.onclick = (e) => {
          e.preventDefault();
          isSignInMode = !isSignInMode;
          
          if (isSignInMode) {
            loginBtn.innerText = "Sign In";
            loginBtn.className = "w-full bg-blue-600 text-white p-4 rounded-2xl font-bold text-lg hover:bg-blue-700 shadow-lg transition-all";
            authToggleText.innerText = "Don't have an account?";
            authToggleLink.innerText = "Create one";
          } else {
            loginBtn.innerText = "Register Account";
            loginBtn.className = "w-full bg-green-600 text-white p-4 rounded-2xl font-bold text-lg hover:bg-green-700 shadow-lg transition-all";
            authToggleText.innerText = "Already registered?";
            authToggleLink.innerText = "Sign In instead";
          }
        };
      }

      if (loginBtn) {
        loginBtn.onclick = async () => {
          const email = document.getElementById("auth-email").value.trim();
          const password = document.getElementById("auth-password").value;

          if (!email || !password) return alert("Please fill out all fields.");

          try {
            if (isSignInMode) {
              await signInWithEmailAndPassword(auth, email, password);
            } else {
              await createUserWithEmailAndPassword(auth, email, password);
              alert("Registration successful! Logging in automatically...");
            }
          } catch (error) {
            console.error(error);
          }
        };
      }

      // Dynamic Leaderboard Medal Allocation Output
      async function loadLeaderboard() {
        const qry = query(collection(db, "quiz_results"), orderBy("score", "desc"), limit(10));
        const snap = await getDocs(qry);
        
        document.getElementById("leaderboard-list").innerHTML = snap.docs.map((d, i) => {
            const data = d.data();
            const scorePercent = data.total > 0 ? (data.score / data.total) * 100 : 0;
            
            let medalBadge = "";
            if (scorePercent === 100) medalBadge = "🏆";       
            else if (scorePercent >= 90) medalBadge = "🥇";    
            else if (scorePercent >= 75) medalBadge = "🥈";    
            else if (scorePercent >= 60) medalBadge = "🥉";    
            else medalBadge = "⭐";                            

            return `
              <div class="flex justify-between p-5 bg-white rounded-2xl shadow-sm font-bold text-sm items-center">
                <span class="flex items-center gap-3">
                  <span class="text-xl w-8 text-center">${medalBadge}</span>
                  <span class="text-slate-400 font-mono">#${i+1}</span>
                  <span class="text-slate-800">${data.name}</span>
                </span>
                <span class="text-blue-600 bg-blue-50 px-4 py-1.5 rounded-xl font-mono">${data.score}/${data.total}</span>
              </div>
            `;
        }).join('');
      }

      async function loadAdminQuestions() {
        const snap = await getDocs(collection(db, "questions")), list = document.getElementById("admin-q-list");
        list.innerHTML = snap.docs.map(q => `
          <div class="flex justify-between items-center p-3 bg-white rounded-xl border border-slate-100 shadow-sm gap-2">
            <span class="font-semibold truncate text-slate-700">
              <strong class="text-blue-600 mr-1">[${q.data().sub}]</strong> ${q.data().question.substring(0,25)}...
            </span>
            <div class="flex items-center gap-1 shrink-0">
              <button class="bg-blue-50 text-blue-600 px-2.5 py-1.5 rounded-lg hover:bg-blue-100 transition-all font-bold text-[10px] uppercase flex items-center gap-1" onclick="window.editQ('${q.id}')">
                <i class="fas fa-edit text-[9px]"></i> Edit
              </button>
              <button class="bg-red-50 text-red-600 px-2.5 py-1.5 rounded-lg hover:bg-red-100 transition-all font-bold text-[10px] uppercase flex items-center gap-1" onclick="window.delQ('${q.id}')">
                <i class="fas fa-trash-alt text-[9px]"></i> Del
              </button>
            </div>
          </div>
        `).join('');
      }
      
      window.delQ = async (id) => { 
        if(confirm("Delete question permanently?")) { 
          await deleteDoc(doc(db, "questions", id)); 
          loadAdminQuestions(); 
          refreshGlobalLists();
        }
      };

      document.getElementById("tab-quiz").onclick = () => { 
          document.getElementById("quiz-tab-content").classList.remove("hidden"); document.getElementById("leaderboard-tab-content").classList.add("hidden"); 
          document.getElementById("tab-quiz").classList.add("border-blue-600", "text-blue-600"); document.getElementById("tab-leaderboard").classList.remove("border-blue-600", "text-blue-600"); 
      };
      document.getElementById("tab-leaderboard").onclick = () => { 
          document.getElementById("quiz-tab-content").classList.add("hidden"); document.getElementById("leaderboard-tab-content").classList.remove("hidden"); 
          document.getElementById("tab-leaderboard").classList.add("border-blue-600", "text-blue-600"); document.getElementById("tab-quiz").classList.remove("border-blue-600", "text-blue-600"); 
          loadLeaderboard();
      };
      document.getElementById("go-to-admin").onclick = () => { navigate('admin-screen'); loadAdminQuestions(); };
      document.getElementById("admin-back").onclick = () => navigate('selection-screen');
      document.getElementById("logout-btn").onclick = () => signOut(auth);
      document.getElementById("export-btn").onclick = async () => {
        const snap = await getDocs(collection(db, "quiz_results")), data = snap.docs.map(d => ({...d.data(), at: d.data().at?.toDate().toLocaleString() }));
        const ws = XLSX.utils.json_to_sheet(data), wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Results"); XLSX.writeFile(wb, "Results.xlsx");
      };
    </script>
  </body>
</html>
